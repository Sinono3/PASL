[project]
name = "pasl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chumpy>=0.70",
    "cython>=3.0.12",
    "fastai>=2.7.12",
    "kornia>=0.6.12",
    "matplotlib>=3.5.3",
    "munch>=4.0.0",
    "numpy<1.24",
    "opencv-python>=4.7",
    "pyyaml>=6.0.1",
    "scikit-image>=0.19.3",
    "tqdm>=4.67.1",
    "yacs>=0.1.8",
    "torch==1.12.1",
    "torchvision==0.13.1",
    "gradio==3.44.3",
    "ffmpeg>=1.4",
    "tensorboardx>=2.6.2.2",
    "pillow==9.4",
    "onnxruntime==1.14.1",
    "einops>=0.8.1",
    "jaxtyping>=0.2.19",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "face-alignment",
    "lightning>=2.1.4",
    "decalib",
    "tddfa",
    "onnx>=1.17.0",
]

[tool.uv.sources]
# Use custom index for PyTorch to use CUDA 11.3 (only on Linux and Windows)
torch = [
  { index = "pytorch-cu113", marker = "sys_platform == 'linux' or sys_platform == 'win32'"  },
]
torchvision = [
  { index = "pytorch-cu113", marker = "sys_platform == 'linux' or sys_platform == 'win32'"  },
]
face-alignment = { git = "https://github.com/1adrianb/face-alignment", rev = "c49ca6fef8ffa95a0ac7ce698e0b752ac91f6d42" }
decalib = { path = "external/deca", editable = true }
tddfa = { path = "external/tddfa", editable = true }

[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.12.4",
]

[tool.ruff]
ignore = ["F722"]

[build-system]
requires = ["hatchling" ]
build-backend = "hatchling.build"
