[project]
name = "pasl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "chumpy>=0.70",
    "cython>=3.0.12",
    "fastai>=2.7.12",
    "kornia>=0.6.12",
    "matplotlib>=3.5.3",
    "munch>=4.0.0",
    "numpy<1.24",
    "opencv-python>=4.7",
    "pyyaml>=6.0.1",
    "scikit-image>=0.19.3",
    "tqdm>=4.67.1",
    "yacs>=0.1.8",
    "torch==1.12.1",
    "torchvision==0.13.1",
    "gradio==3.34.0",
    "ffmpeg>=1.4",
    "tensorboardx>=2.6.2.2",
    "pillow==9.4",
    "onnxruntime==1.14.1",
    "pytorch3d",
    "einops>=0.8.1",
    "jaxtyping>=0.2.19",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "face_alignment",
]

[tool.uv.sources]
# Use custom index for PyTorch to use CUDA 11.3 (only on Linux and Windows)
torch = [
  { index = "pytorch-cu113", marker = "sys_platform == 'linux' or sys_platform == 'win32'"  },
]
torchvision = [
  { index = "pytorch-cu113", marker = "sys_platform == 'linux' or sys_platform == 'win32'"  },
]
# Use pytorch3d v0.7.3
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d", rev = "e245560abb8f019a24880faf7557ed3b2eec6cc0A" }
face_alignment = { path = "external/face_alignment" }

[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.12.4",
]

[tool.ruff]
ignore = ["F722"]
